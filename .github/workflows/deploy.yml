# ============================================================================
# .github/workflows/deploy.yml
# Continuous Deployment — triggers on merge to main after CI passes.
#
# Pipeline:
#   1. build-push  – Build multi-arch Docker image, push to GHCR
#   2. migrate     – Run `prisma migrate deploy` against the production DB
#   3. deploy      – Roll out the new image to the production server via SSH
#   4. smoke       – Verify /api/v1/health returns 200 within 60s
#
# Required GitHub Secrets (Settings → Secrets → Actions):
#   DEPLOY_HOST         SSH hostname or IP of the production server
#   DEPLOY_USER         SSH username (e.g. ubuntu, deploy)
#   DEPLOY_SSH_KEY      Private SSH key (RSA or Ed25519, no passphrase)
#   DEPLOY_DIR          Absolute path on server (e.g. /srv/workhq)
#   PRODUCTION_DATABASE_URL   Full Postgres connection string
#   PRODUCTION_JWT_SECRET     JWT signing secret (≥ 64 chars)
#   PRODUCTION_REDIS_PASSWORD Redis password
#   PRODUCTION_TELEGRAM_BOT_TOKEN
#   PRODUCTION_TELEGRAM_WEBHOOK_SECRET
#   PRODUCTION_CORS_ORIGINS   e.g. https://app.workhq.com
#
# Optional Secrets:
#   SLACK_WEBHOOK_URL   Post deployment notifications to Slack
# ============================================================================

name: Deploy

on:
  push:
    branches:
      - main
  # Also allow manual trigger with optional reason
  workflow_dispatch:
    inputs:
      reason:
        description: Reason for manual deployment
        required: false
        default: Manual trigger

# Only one deployment can run at a time
concurrency:
  group: deploy-production
  cancel-in-progress: false   # never cancel a running deploy — finish it

env:
  REGISTRY:   ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/workhq-backend
  NODE_VERSION: '20'

jobs:
  # ── Build and push Docker image ───────────────────────────────────────────
  build-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # needed to push to GHCR

    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      image_digest: ${{ steps.push.outputs.digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=main,enable={{is_default_branch}}

      - name: Build and push multi-arch image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record image digest
        run: echo "Pushed ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}"

  # ── Run Prisma migrations against production DB ───────────────────────────
  migrate:
    name: Database Migration
    runs-on: ubuntu-latest
    needs: build-push
    environment: production    # requires manual approval if configured

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci --omit=dev

      - name: Generate Prisma client
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: npx prisma generate --schema=../prisma/schema.prisma

      - name: Run database migrations
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: |
          echo "Running migrations against production database…"
          npx prisma migrate deploy --schema=../prisma/schema.prisma
          echo "✅ Migrations completed successfully"

      - name: Verify migration status
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: |
          npx prisma migrate status --schema=../prisma/schema.prisma
          echo "✅ All migrations applied"

  # ── Deploy to production server via SSH ───────────────────────────────────
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build-push, migrate]
    environment: production

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 120s
          script: |
            set -e
            cd ${{ secrets.DEPLOY_DIR }}

            echo "=== Pulling latest compose files ==="
            git pull origin main

            echo "=== Logging in to GHCR ==="
            echo "${{ secrets.GITHUB_TOKEN }}" | \
              docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            echo "=== Pulling new API image ==="
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

            echo "=== Running database migrations (single instance) ==="
            docker compose \
              -f docker-compose.yml \
              -f docker-compose.prod.yml \
              run --rm migrate

            echo "=== Rolling out new image ==="
            IMAGE_TAG=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            POSTGRES_PASSWORD=${{ secrets.PRODUCTION_DATABASE_URL }} \
            REDIS_PASSWORD=${{ secrets.PRODUCTION_REDIS_PASSWORD }} \
            JWT_SECRET=${{ secrets.PRODUCTION_JWT_SECRET }} \
            DATABASE_URL=${{ secrets.PRODUCTION_DATABASE_URL }} \
            REDIS_URL=redis://:${{ secrets.PRODUCTION_REDIS_PASSWORD }}@redis:6379 \
            CORS_ORIGINS=${{ secrets.PRODUCTION_CORS_ORIGINS }} \
            TELEGRAM_BOT_TOKEN=${{ secrets.PRODUCTION_TELEGRAM_BOT_TOKEN }} \
            TELEGRAM_WEBHOOK_SECRET=${{ secrets.PRODUCTION_TELEGRAM_WEBHOOK_SECRET }} \
              docker compose \
                -f docker-compose.yml \
                -f docker-compose.prod.yml \
                up -d --no-build api nginx

            echo "=== Removing dangling images ==="
            docker image prune -f

            echo "✅ Deployment complete"

  # ── Smoke test ────────────────────────────────────────────────────────────
  smoke:
    name: Smoke Test
    runs-on: ubuntu-latest
    needs: deploy
    timeout-minutes: 5

    steps:
      - name: Wait for health check to pass
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          echo "Waiting for /api/v1/health to return 200…"
          MAX_RETRIES=12
          RETRY_INTERVAL=5
          for i in $(seq 1 $MAX_RETRIES); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              "https://${DEPLOY_HOST}/api/v1/health" || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "✅ Health check passed (attempt $i)"
              exit 0
            fi
            echo "⏳ Attempt $i/$MAX_RETRIES — status=$STATUS, retrying in ${RETRY_INTERVAL}s…"
            sleep $RETRY_INTERVAL
          done
          echo "❌ Health check did not pass after $MAX_RETRIES attempts"
          exit 1

      - name: Verify health response shape
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          RESPONSE=$(curl -sf "https://${DEPLOY_HOST}/api/v1/health")
          echo "Response: $RESPONSE"
          # Must contain "status":"ok" and "db":"up"
          echo "$RESPONSE" | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          assert d.get('status') == 'ok',  f'Expected status=ok, got {d}'
          assert d.get('db') == 'up',      f'Expected db=up, got {d}'
          print('✅ Health response shape verified')
          "

  # ── Notify on failure ─────────────────────────────────────────────────────
  notify-failure:
    name: Notify Failure
    runs-on: ubuntu-latest
    needs: [build-push, migrate, deploy, smoke]
    if: failure() && secrets.SLACK_WEBHOOK_URL != ''

    steps:
      - name: Send Slack notification
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "❌ WorkHQ deployment failed on `${{ github.ref_name }}`",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "❌ *WorkHQ deployment failed*\n*Branch:* `${{ github.ref_name }}`\n*Commit:* `${{ github.sha }}`\n*Triggered by:* ${{ github.actor }}\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
