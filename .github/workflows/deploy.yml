# ============================================================================
# .github/workflows/deploy.yml
# Deploy main to the production VPS over SSH (see DEPLOY_VPS.md).
#
# The VPS builds the images itself from the checked-out repo, runs the
# one-shot Prisma migration container, then restarts the stack. Secrets never
# pass through GitHub: they live in <DEPLOY_DIR>/.env on the server.
#
# Enable once the server is set up:
#   Settings → Secrets and variables → Actions
#     Variables: DEPLOY_ENABLED = true
#                WORKHQ_DOMAIN  = hr.example.com
#     Secrets:   DEPLOY_HOST     server IP
#                DEPLOY_USER     deploy
#                DEPLOY_SSH_KEY  private key for DEPLOY_USER (ed25519, no passphrase)
#                DEPLOY_DIR      /srv/workhq
# ============================================================================

name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Only one deployment at a time; never cancel one half-way.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to VPS
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30

    steps:
      - name: Build and restart on the server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 25m
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_DIR }}"
            compose="docker compose -f docker-compose.yml -f docker-compose.prod.yml"

            echo "=== Updating code to ${{ github.sha }} ==="
            git fetch --quiet origin main
            git reset --hard "${{ github.sha }}"

            echo "=== Building images ==="
            $compose build --pull

            echo "=== Running database migrations ==="
            $compose run --rm migrate

            echo "=== Restarting services ==="
            $compose up -d --remove-orphans

            docker image prune -f
            echo "✅ Deployed ${{ github.sha }}"

      - name: Smoke test
        env:
          DOMAIN: ${{ vars.WORKHQ_DOMAIN }}
        run: |
          for i in $(seq 1 24); do
            if curl -sf "https://${DOMAIN}/api/v1/health/live" >/dev/null; then break; fi
            echo "⏳ waiting for API ($i/24)…"; sleep 5
          done
          body=$(curl -sf "https://${DOMAIN}/api/v1/health")
          echo "$body"
          echo "$body" | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          assert d.get('status') == 'ok', d
          assert d['checks']['database'] == 'up', d
          assert d['checks']['redis'] == 'up', d
          print('✅ Health OK')
          "
          curl -sf -o /dev/null "https://${DOMAIN}/" && echo "✅ Web OK"
