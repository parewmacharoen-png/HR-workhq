# WorkHQ — Render Blueprint (free-tier compatible)
#
# IMPORTANT: Render free Postgres does NOT include pgvector.
# Set DATABASE_URL to Neon (or Supabase) with pgvector enabled:
#   1. https://console.neon.tech → New Project
#   2. SQL Editor: CREATE EXTENSION IF NOT EXISTS vector;
#   3. Copy connection string → workhq-api env DATABASE_URL
#   4. Manual Deploy workhq-api
#
# Free web limits: pause unused services (push-*) if deploy fails.

services:
  - type: web
    name: workhq-api
    runtime: node
    plan: free
    buildCommand: cd backend && npm ci && npx prisma generate --schema=../prisma/schema.prisma && npm run build
    startCommand: cd backend && npx prisma migrate deploy --schema=../prisma/schema.prisma && node dist/main.js
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_VERSION
        value: "20.18.1"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          name: workhq-redis
          type: keyvalue
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: METRICS_TOKEN
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: TELEGRAM_WEBHOOK_URL
        sync: false
      - key: WORKHQ_WEB_URL
        sync: false
      - key: DOCUMENT_STORAGE_BASE_PATH
        value: /tmp/workhq/documents

  - type: web
    name: workhq-web
    runtime: static
    buildCommand: cd web && npm ci && npm run build
    staticPublishPath: web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "20.18.1"
      - key: VITE_API_BASE
        sync: false

  - type: keyvalue
    name: workhq-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []
