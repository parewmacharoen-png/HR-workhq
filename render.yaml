# WorkHQ — Render Blueprint
# Deploy: Blueprints → Manual sync after push
#
# Free tier: max ~2 free Web Services per workspace.
# If workhq-api fails while static web succeeds, pause unused services
# (e.g. push-frontend / push-backend) then Manual sync again.

services:
  - type: web
    name: workhq-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: cd backend && npm ci && npx prisma generate --schema=../prisma/schema.prisma && npm run build
    preDeployCommand: cd backend && npx prisma migrate deploy --schema=../prisma/schema.prisma
    startCommand: cd backend && node dist/main.js
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_VERSION
        value: "20.18.1"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: workhq-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: workhq-redis
          type: keyvalue
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: METRICS_TOKEN
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: TELEGRAM_WEBHOOK_URL
        sync: false
      - key: WORKHQ_WEB_URL
        sync: false
      - key: DOCUMENT_STORAGE_BASE_PATH
        value: /tmp/workhq/documents

  - type: web
    name: workhq-web
    runtime: static
    plan: free
    region: singapore
    buildCommand: cd web && npm ci && npm run build
    staticPublishPath: web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "20.18.1"
      - key: VITE_API_BASE
        sync: false

  - type: keyvalue
    name: workhq-redis
    plan: free
    region: singapore
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

databases:
  - name: workhq-db
    plan: free
    region: singapore
    databaseName: workhq
    user: workhq
