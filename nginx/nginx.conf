# ============================================================================
# WorkHQ — nginx.conf
# Reverse proxy configuration for the NestJS API.
#
# Features:
#   * HTTP → HTTPS redirect
#   * SSL/TLS termination (certificates in /etc/nginx/ssl/)
#   * Rate limiting: 60 req/min per IP for API, 10 req/min for auth
#   * Request size limit (10 MB — covers file uploads)
#   * Gzip compression for JSON responses
#   * Health-check endpoint bypasses rate limiting
#   * X-Forwarded-* headers forwarded to NestJS (needed for IP logging)
#   * Security headers (CSP, HSTS, frame-deny)
#   * Upstream pool matches docker-compose replicas (api:3000 × 2)
#
# Place TLS certificates at:
#   /etc/nginx/ssl/fullchain.pem   (certificate + chain)
#   /etc/nginx/ssl/privkey.pem     (private key)
# Generate with: certbot certonly --standalone -d your-domain.com
# ============================================================================

user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
  worker_connections 1024;
  use epoll;
  multi_accept on;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # ── Logging ──────────────────────────────────────────────────────────────
  log_format main '$remote_addr - $remote_user [$time_local] '
                  '"$request" $status $body_bytes_sent '
                  '"$http_referer" "$http_user_agent" '
                  'rt=$request_time uct=$upstream_connect_time '
                  'uht=$upstream_header_time urt=$upstream_response_time';
  access_log /var/log/nginx/access.log main;

  # ── Performance ───────────────────────────────────────────────────────────
  sendfile           on;
  tcp_nopush         on;
  tcp_nodelay        on;
  keepalive_timeout  65;
  types_hash_max_size 2048;
  client_max_body_size 10m;      # covers file uploads; adjust per requirement

  # ── Gzip ─────────────────────────────────────────────────────────────────
  gzip              on;
  gzip_vary         on;
  gzip_proxied      any;
  gzip_comp_level   4;
  gzip_buffers      16 8k;
  gzip_http_version 1.1;
  gzip_types
    application/json
    application/javascript
    text/plain
    text/css
    text/xml
    text/javascript
    image/svg+xml;

  # ── Rate limiting zones ────────────────────────────────────────────────
  # General API: 60 requests per minute per IP (burst up to 20 without delay)
  limit_req_zone $binary_remote_addr zone=api:10m rate=60r/m;
  # Auth endpoints: 10 requests per minute per IP (stricter)
  limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
  # Telegram webhook: allow higher throughput from Telegram servers
  limit_req_zone $binary_remote_addr zone=webhook:10m rate=300r/m;

  # ── Upstream — NestJS API containers ─────────────────────────────────
  # docker-compose scales api to 2 replicas; nginx round-robins between them.
  # In a single-instance setup this resolves to a single backend.
  upstream nestjs_api {
    least_conn;
    server api:3000 max_fails=3 fail_timeout=30s;
    keepalive 32;
  }

  upstream web_app {
    server web:80 max_fails=3 fail_timeout=30s;
    keepalive 8;
  }

  # ── HTTP → HTTPS redirect ─────────────────────────────────────────────
  server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Allow ACME challenge for Let's Encrypt certificate renewal
    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    # Redirect everything else to HTTPS
    location / {
      return 301 https://$host$request_uri;
    }
  }

  # ── HTTPS ─────────────────────────────────────────────────────────────────
  server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name _;

    # ── TLS certificates (mount from host / volume) ──────────────────────
    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    # ── TLS hardening ─────────────────────────────────────────────────────
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;
    ssl_stapling              on;
    ssl_stapling_verify       on;

    # ── Security headers ───────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options            DENY                                            always;
    add_header X-Content-Type-Options     nosniff                                         always;
    add_header X-XSS-Protection           "1; mode=block"                                 always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin"               always;
    add_header Content-Security-Policy    "default-src 'none'; frame-ancestors 'none'"   always;
    add_header Permissions-Policy         "geolocation=(), microphone=(), camera=()"      always;

    # ── Proxy common settings ──────────────────────────────────────────────
    proxy_http_version  1.1;
    proxy_set_header    Connection        "";
    proxy_set_header    Host              $host;
    proxy_set_header    X-Real-IP         $remote_addr;
    proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header    X-Forwarded-Proto $scheme;
    proxy_read_timeout  60s;
    proxy_send_timeout  60s;
    proxy_connect_timeout 10s;

    # ── Health check — no rate limit, no auth ─────────────────────────────
    location = /api/v1/health {
      proxy_pass http://nestjs_api;
      access_log off;
    }

    location = /api/v1/health/metrics {
      proxy_pass http://nestjs_api;
      access_log off;
    }

    location = /api/v1/health/details {
      proxy_pass http://nestjs_api;
      access_log off;
    }

    # ── Telegram webhook — higher rate limit ──────────────────────────────
    location ~ ^/api/v[0-9]+/telegram/webhook {
      limit_req zone=webhook burst=50 nodelay;
      limit_req_status 429;
      proxy_pass http://nestjs_api;
    }

    # ── Auth endpoints — strict rate limit ────────────────────────────────
    location ~ ^/api/v[0-9]+/auth/ {
      limit_req zone=auth burst=5 nodelay;
      limit_req_status 429;
      proxy_pass http://nestjs_api;
    }

    # ── All other API routes ───────────────────────────────────────────────
    location /api/ {
      limit_req zone=api burst=20 nodelay;
      limit_req_status 429;
      proxy_pass http://nestjs_api;
    }

    # ── Web back office (SPA) ─────────────────────────────────────────────
    location / {
      proxy_pass http://web_app;
      proxy_set_header Host $host;
    }
  }
}
