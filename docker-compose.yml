# ============================================================================
# WorkHQ — docker-compose.yml (development)
# Services:
#   postgres  – PostgreSQL 16 with pgvector + btree_gist + pgcrypto
#   redis     – Redis 7 (session cache / future BullMQ queue)
#   api       – NestJS backend (built from local source, hot-reload ready)
#
# Usage:
#   # Start all services in foreground
#   docker compose up
#
#   # Start in background
#   docker compose up -d
#
#   # Rebuild API image after code changes
#   docker compose up --build api
#
#   # View logs
#   docker compose logs -f api
#
#   # Run Prisma Studio against the dev DB
#   docker compose exec api npx prisma studio --schema=./prisma/schema.prisma
#
# Prerequisites:
#   Copy .env.example to .env and fill in JWT_SECRET (anything ≥ 16 chars for dev).
#   DATABASE_URL and REDIS_URL are wired automatically by this compose file.
# ============================================================================

services:

  # ── PostgreSQL 16 + pgvector ───────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: workhq-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER:     workhq
      POSTGRES_PASSWORD: workhq
      POSTGRES_DB:       workhq
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Init script: create all 19 application schemas before migrations run.
      - ./docker/postgres/init-schemas.sql:/docker-entrypoint-initdb.d/01-schemas.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workhq -d workhq"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ── Redis 7 ───────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: workhq-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── Database migrations (one-shot, before API starts) ─────────────────────
  migrate:
    build:
      context: .
      dockerfile: Dockerfile.migrate
    container_name: workhq-migrate
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://workhq:workhq@postgres:5432/workhq

  # ── WorkHQ API (NestJS) ───────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: workhq-api
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      # Override specific vars wired to compose service names
      NODE_ENV:     development
      PORT:         3000
      DATABASE_URL: postgresql://workhq:workhq@postgres:5432/workhq
      REDIS_URL:    redis://redis:6379
      DOCUMENT_STORAGE_BASE_PATH: /var/workhq/storage/documents
    volumes:
      - document_storage:/var/workhq/storage
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/api/v1/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  # ── WorkHQ Web (React back office) ────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        VITE_API_BASE: /api/v1
    container_name: workhq-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 15s

  # ── Daily PostgreSQL backups (cron) ───────────────────────────────────────
  backup-cron:
    build:
      context: ./docker/backup
      dockerfile: Dockerfile
    container_name: workhq-backup-cron
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://workhq:workhq@postgres:5432/workhq
      BACKUP_DIR: /backups
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      BACKUP_CRON_SCHEDULE: ${BACKUP_CRON_SCHEDULE:-0 2 * * *}
    volumes:
      - ./backups:/backups

volumes:
  postgres_data:
  redis_data:
  document_storage:
